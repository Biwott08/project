<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Production</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Dairy Farm Management System</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="cows.html">Cow Management</a>
    <a href="milk.html">Milk Production</a>
    <a href="health.html">Animal Health</a>
    <a href="breeding.html">Breeding</a>
    <a href="sales.html">Milk Sales</a>
    <a href="expenses.html">Expenses</a>
</nav>

<main>
    <h2>Milk Production Records</h2>

    <form id="milkForm">
        <label>Cow Tag Number:</label>
        <input type="text" id="milkCowTag" required>

        <label>Date:</label>
        <input type="date" id="milkDate" required>

        <label>Morning Production (Litres):</label>
        <input type="number" id="morningMilk" min="0" step="0.1" required>

        <label>Evening Production (Litres):</label>
        <input type="number" id="eveningMilk" min="0" step="0.1" required>

        <button type="submit">Save Production</button>
    </form>

    <h2>Production History</h2>

    <table>
        <thead>
            <tr>
                <th>Cow Tag</th>
                <th>Date</th>
                <th>Morning (L)</th>
                <th>Evening (L)</th>
                <th>Total (L)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="milkTable"></tbody>
    </table>
</main>

<script src="js/app.js"></script>
</body>
</html>
