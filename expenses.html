<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Expenses</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Dairy Farm Management System</h1>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="cows.html">Cow Management</a>
    <a href="milk.html">Milk Production</a>
    <a href="health.html">Animal Health</a>
    <a href="breeding.html">Breeding</a>
    <a href="sales.html">Milk Sales</a>
    <a href="expenses.html">Expenses</a>
</nav>

<main>
    <h2>Farm Expense Records</h2>

    <form id="expenseForm">
        <label>Expense Date:</label>
        <input type="date" id="expenseDate" required>

        <label>Expense Category:</label>
        <select id="expenseCategory" required>
            <option value="">Select category</option>
            <option value="Feeds">Animal Feeds</option>
            <option value="Veterinary">Veterinary Services</option>
            <option value="Medicine">Medicine</option>
            <option value="Labour">Labour</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Equipment">Equipment</option>
            <option value="Other">Other</option>
        </select>

        <label>Description:</label>
        <input type="text" id="expenseDescription" required>

        <label>Amount (KES):</label>
        <input type="number" id="expenseAmount" min="0" step="0.01" required>

        <button type="submit">Save Expense</button>
    </form>

    <h2>Expense History</h2>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount (KES)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expensesTable"></tbody>
    </table>
</main>

<script src="js/app.js"></script>
</body>
</html>
